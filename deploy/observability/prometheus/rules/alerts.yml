groups:
  - name: tamthuc
    rules:
      - alert: ChartGenP95High
        expr: chart_gen_seconds_p95 > 5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Chart generation p95 > 5s
          runbook: https://docs.tamthuc.local/runbooks/chart-gen-p95
      - alert: ErrorRateHigh
        expr: rate(http_errors_total[5m]) / rate(http_requests_total[5m]) > 0.01
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: Error rate > 1%
          runbook: https://docs.tamthuc.local/runbooks/error-rate
      - alert: LLMDowntime
        expr: up{job="llm-probe"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: LLM probe down
          runbook: https://docs.tamthuc.local/runbooks/llm
      - alert: DBConnectionIssues
        expr: db_pool_wait_seconds > 1
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: DB pool saturation
          runbook: https://docs.tamthuc.local/runbooks/db-pool
