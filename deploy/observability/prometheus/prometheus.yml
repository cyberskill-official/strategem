global:
  scrape_interval: 15s
scrape_configs:
  # TT-002 / metrics: GET /metrics requires a verified Bearer JWT (or REQUIRE_AUTH=0
  # break-glass). Prometheus cannot scrape anonymously.
  # Wire a scrape token via authorization.credentials (from compose secret /
  # METRICS_BEARER), or use a network-local sidecar that injects Authorization.
  - job_name: tamthuc-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
    # Uncomment and inject a non-expiring scrape principal JWT (ops-owned):
    # authorization:
    #   type: Bearer
    #   credentials_file: /run/secrets/metrics_bearer
