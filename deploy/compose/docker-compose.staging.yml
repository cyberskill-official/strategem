# Staging compose bootstrap (FR-PLAT-004). Replaced by K8s in FR-PLAT-010.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: strategem
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d strategem"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-cyberskill/strategem}/api:${IMAGE_TAG:-staging}
    ports:
      - "${STAGING_API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/strategem
      TAMTHUC_AUTH_JWT_SECRET: ${TAMTHUC_AUTH_JWT_SECRET:?set secret}
      # COV-020: cast readiness gate for staging/prod
      CAST_CLI: ${CAST_CLI:-/src/cast-cli}
      READY_REQUIRE_CAST_CLI: "1"
      HOST: "0.0.0.0"
      PORT: "8000"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://staging.example.com,http://localhost:3000}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/${GITHUB_REPOSITORY:-cyberskill/strategem}/web:${IMAGE_TAG:-staging}
    ports:
      - "${STAGING_WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://127.0.0.1:8000}
    depends_on:
      - api
