# EXPERIMENTAL — Kubernetes scaffold only. See api-deployment.yaml header.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tamthuc-web
  namespace: strategem
  labels:
    strategem.io/scaffold: experimental
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tamthuc-web
  template:
    metadata:
      labels:
        app: tamthuc-web
    spec:
      containers:
        - name: web
          image: strategem/web:latest
          ports:
            - containerPort: 3000
