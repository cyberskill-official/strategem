# Strategem API stack on VPS (TASK-PLAT-013 / D-CD-001).
# Usage:
#   docker compose --env-file .env -f docker-compose.api.yml up -d
# Prefer API_IMAGE=…@sha256:… from CI; :main fallback is for bootstrap only.
services:
  api:
    image: ${API_IMAGE:-ghcr.io/cyberskill-official/strategem-api:main}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL}
      CAST_CLI: ${CAST_CLI:-/usr/local/bin/cast-cli}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
