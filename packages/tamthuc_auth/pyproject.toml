[project]
name = "tamthuc-auth"
version = "0.1.0"
description = "TASK-AUTH-001: identity, JWT, social OIDC hooks, birth_data AES-256-GCM"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "argon2-cffi>=23.1",
  "PyJWT[crypto]>=2.8",
  "cryptography>=42.0",
  "fastapi>=0.111",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tamthuc_auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
