[project]
name = "db-schema"
version = "0.1.0"
description = "FR-PLAT-003 migration apply helper + RLS isolation tests"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
]

[project.scripts]
db-migrate = "db_schema.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/db_schema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
