[project]
name = "tamthuc-api"
version = "0.1.0"
description = "API surface + query orchestration (FR-API-001) + observability (FR-PLAT-005)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.111",
  "httpx>=0.27",
  "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tamthuc_api"]
