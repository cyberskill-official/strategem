[project]
name = "tamthuc-api"
version = "0.1.0"
description = "API surface + query orchestration (TASK-API-001) + observability (TASK-PLAT-005)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.111",
  "httpx>=0.27",
  "uvicorn[standard]>=0.30",
  "tamthuc-report",
  "tamthuc-strat",
  "tamthuc-auth",
  "tamthuc-kb",
  "tamthuc-edu",
  "db-schema",
  "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tamthuc_api"]

[tool.uv.sources]
tamthuc-report = { workspace = true }
tamthuc-strat = { workspace = true }
tamthuc-auth = { workspace = true }
tamthuc-kb = { workspace = true }
tamthuc-edu = { workspace = true }
db-schema = { workspace = true }
