[project]
name = "tamthuc-report"
version = "0.1.0"
description = "Structured report assembly (TASK-REPORT-001)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "reportlab>=4.2",
    "types-reportlab>=4.5.1.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tamthuc_report"]

[tool.hatch.build.targets.wheel.force-include]
"src/tamthuc_report/templates" = "tamthuc_report/templates"
