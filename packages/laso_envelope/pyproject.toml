[project]
name = "laso-envelope"
version = "0.1.0"
description = "La so JSON envelope contract types (Pydantic). Source of truth: docs/contracts/laso-envelope.schema.json"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laso_envelope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
