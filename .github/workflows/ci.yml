name: CI

on:
  push:
    branches: [main, "auto/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: Rust gate
        run: |
          cargo fmt --check
          cargo clippy --workspace -- -D warnings
          cargo test --workspace
        shell: bash

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: strategem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d strategem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/strategem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3
        with:
          version: "0.11.32"
      - name: Set up Python
        run: uv python pin 3.12
      - name: Python gate
        run: |
          uv sync --all-packages
          uv run ruff check
          uv run ruff format --check
          uv run mypy packages/
          uv run pytest -q
        shell: bash
      - name: E2E cast path (calculate + get query)
        env:
          # Deterministic interpret path in CI (no live LLM / soft-review flakiness)
          INTERPRET_MODE: template
          LLM_BACKEND: stub
        run: |
          # Build cast-cli for optional CAST_CLI path (API falls back if missing)
          cargo build -p cast-cli --release
          export CAST_CLI="${GITHUB_WORKSPACE}/target/release/cast-cli"
          uv run pytest packages/tamthuc_api/tests/test_e2e_cast.py -q --tb=short
        shell: bash

  status-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Status page must match task frontmatter (done counts)
        run: bash scripts/check-status-sync.sh
        shell: bash

  # LEGAL-004: keep artifacts consistent. Do not require approved (that is a
  # human counsel decision). Fail CI if someone fakes approval without lockstep
  # markers, or if the fail-closed script is missing.
  counsel-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate LEGAL-004 gate artifacts
        run: |
          set -euo pipefail
          STATUS=docs/legal/vn-legal-review/gate-status.json
          test -f "$STATUS"
          test -f docs/legal/vn-legal-review/counsel-signoff-record.md
          test -f docs/legal/vn-legal-review/operator-runbook.md
          test -x scripts/check-counsel-signoff.sh || chmod +x scripts/check-counsel-signoff.sh
          verdict="$(python3 -c "import json; print(json.load(open('$STATUS'))['verdict'])")"
          set +e
          bash scripts/check-counsel-signoff.sh
          code=$?
          set -e
          if [[ "$verdict" == "pending" || "$verdict" == "rejected" ]]; then
            if [[ "$code" -eq 0 ]]; then
              echo "LEGAL-004: script must fail-close while verdict=$verdict" >&2
              exit 1
            fi
            echo "LEGAL-004: fail-closed OK (verdict=$verdict) — public launch blocked"
          else
            if [[ "$code" -ne 0 ]]; then
              echo "LEGAL-004: verdict=$verdict but check-counsel-signoff.sh failed" >&2
              exit 1
            fi
            echo "LEGAL-004: counsel gate open (verdict=$verdict)"
          fi
        shell: bash

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6
        # version resolved from root package.json "packageManager" field
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24.18.0
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Web gate
        run: |
          pnpm --filter web install --ignore-scripts
          pnpm --filter web build
          # WEB-018: critical story CSS must exist in compiled .next output
          pnpm --filter web test:css-smoke
          pnpm --filter web lint
          pnpm --filter web test
        shell: bash
        working-directory: .
        env:
          CI: true
