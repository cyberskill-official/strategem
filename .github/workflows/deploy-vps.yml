# TASK-PLAT-015: build API image → GHCR → SSH roll VPS
# Requires secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY
# Web deploys separately via Vercel Git integration.

name: Deploy VPS API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "db/**"
      - "deploy/**"
      - "crates/**"
      - ".github/workflows/deploy-vps.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-vps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/strategem-api"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "tag_main=${IMAGE}:main" >> "$GITHUB_OUTPUT"
      - name: Build and push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tag_sha }}
            ${{ steps.meta.outputs.tag_main }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Uncomment for human prod gate:
    # environment: production
    # NOTE: job-level `if: secrets.*` is invalid — GitHub does not expose `secrets`
    # in job `if` expressions. Gate the SSH step via env + step if instead.
    steps:
      - name: Check VPS deploy secrets
        id: vps
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -n "${VPS_HOST:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "VPS_HOST secret empty — skip SSH deploy (set VPS_HOST/VPS_USER/VPS_SSH_KEY when ready)"
          fi
      - name: SSH deploy
        if: steps.vps.outputs.configured == 'true'
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17  # v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            export API_IMAGE="ghcr.io/${{ github.repository_owner }}/strategem-api:${{ github.sha }}"
            cd "${STRATEGEM_REPO_DIR:-$HOME/strategem}"
            # pin image tag in env for compose
            if [[ -f deploy/vps/.env ]]; then
              sed -i.bak "s|^API_IMAGE=.*|API_IMAGE=${API_IMAGE}|" deploy/vps/.env || \
                echo "API_IMAGE=${API_IMAGE}" >> deploy/vps/.env
            fi
            bash deploy/vps/deploy.sh
