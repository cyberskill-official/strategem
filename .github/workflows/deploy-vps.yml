# FR-PLAT-015: build API image → GHCR → SSH roll VPS
# Requires secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY
# Web deploys separately via Vercel Git integration.

name: Deploy VPS API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "db/**"
      - "deploy/**"
      - "crates/**"
      - ".github/workflows/deploy-vps.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/strategem-api"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "tag_main=${IMAGE}:main" >> "$GITHUB_OUTPUT"
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tag_sha }}
            ${{ steps.meta.outputs.tag_main }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Uncomment for human prod gate:
    # environment: production
    if: ${{ secrets.VPS_HOST != '' }}
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            export API_IMAGE="ghcr.io/${{ github.repository_owner }}/strategem-api:${{ github.sha }}"
            cd "${STRATEGEM_REPO_DIR:-$HOME/strategem}"
            # pin image tag in env for compose
            if [[ -f deploy/vps/.env ]]; then
              sed -i.bak "s|^API_IMAGE=.*|API_IMAGE=${API_IMAGE}|" deploy/vps/.env || \
                echo "API_IMAGE=${API_IMAGE}" >> deploy/vps/.env
            fi
            bash deploy/vps/deploy.sh
