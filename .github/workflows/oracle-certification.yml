name: Oracle certification (COV-001)

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "crates/cyberos-qimen/**"
      - "crates/cyberos-luchnham/**"
      - "crates/cyberos-thaiat/**"
      - "crates/cyberos-lichphap/**"
      - "crates/cast-cli/**"
      - ".github/workflows/oracle-certification.yml"
      - "docs/status/oracle/**"

permissions:
  contents: read

concurrency:
  group: oracle-cert-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
      - name: QiMen cert ≥30
        run: cargo test -p cyberos-qimen --test certification_suite
      - name: LiuRen cert ≥30
        run: cargo test -p cyberos-luchnham --test certification_suite
      - name: TaiYi cert ≥20
        run: cargo test -p cyberos-thaiat --test certification_suite
      - name: Tiet khi multi-year <60s ≥50
        run: cargo test -p cyberos-lichphap --test tietkhi_certification
      - name: Legacy core oracle harness
        run: cargo test -p cyberos-lichphap --test oracle_harness
