name: CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: strategem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d strategem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/strategem
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Python + DB integration (migrations + RLS)
        run: |
          uv python pin 3.12
          uv sync --all-packages
          uv run pytest -q packages/db_schema
        shell: bash

  build-images:
    runs-on: ubuntu-latest
    needs: [integration]
    strategy:
      matrix:
        include:
          - name: engine
            file: deploy/docker/engine.Dockerfile
          - name: api
            file: deploy/docker/api.Dockerfile
          - name: web
            file: deploy/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          load: true
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          # Match security-scan.yml: only fail on issues that have a published fix.
          # Base-image OS CVEs without a Debian fix still surface in the table.
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-images]
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v7
      - name: Record deployed tag
        run: |
          echo "deploy_target=staging" >> "$GITHUB_STEP_SUMMARY"
          echo "image_tag=${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p deploy/records
          echo "${{ github.sha }}" > deploy/records/staging.tag
          echo "Staging deploy recorded for ${{ github.sha }} (compose target; K8s in PLAT-010)"

  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment:
      name: production
      # Protection rule (required reviewers) must be configured in GitHub
      # Settings → Environments → production. This job will not run until approved.
    steps:
      - uses: actions/checkout@v7
      - name: Promote SHA to production
        run: |
          echo "deploy_target=production" >> "$GITHUB_STEP_SUMMARY"
          echo "image_tag=${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Production promote of ${{ github.sha }} (manual approval via environment)"
