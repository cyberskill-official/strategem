[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
version = "0.1.0"
authors = ["CyberSkill <dev@cyberskill.example>"]
repository = "https://github.com/CyberSkill/strategem"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tracing = "0.1"
